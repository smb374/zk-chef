[note]
language = "en"
default-title = "untitled"
# The file stem is the note's ID: 6 random lowercase letters and digits.
filename = "{{id}}"
extension = "md"
template = "note.md"
id-charset = "alphanum"
id-length = 6
id-case = "lower"
# raw/ holds source copies, not notes.
exclude = ["raw"]

[format.markdown]
link-format = "[[{{filename}}|{{title}}]]"
hashtags = false
colon-tags = false

# zk passes the arguments to an alias only through "$@". Run aliases with sh, because fish and other login shells reject "$@".
# Use: zk note --title "Title"
[tool]
shell = "/bin/sh"

[alias]
note = "zk new notes --template note.md --print-path --no-input \"$@\""
source = "zk new notes --template source.md --print-path --no-input \"$@\""
hub = "zk new notes --template hub.md --print-path --no-input \"$@\""
log = "zk new notes --template log.md --print-path --no-input \"$@\""
